services:
  - type: web
    name: langflow-json-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGFLOW_WORKFLOW_PATH
        value: workflow.json
      - key: PORT
        value: $PORT 
