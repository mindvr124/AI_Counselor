services:
  - type: web
    name: langflow-json-api
    env: python
    pythonVersion: 3.10
    buildCommand: |
      export CARGO_HOME=/tmp/cargo
      export CARGO_TARGET_DIR=/tmp/target
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGFLOW_WORKFLOW_PATH
        value: workflow.json
