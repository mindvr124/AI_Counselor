services:
  - type: web
    name: langflow-json-api
    env: python
    buildCommand: |
      rm -rf ~/.cargo ~/.rustup
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGFLOW_WORKFLOW_PATH
        value: workflow.json
      - key: PORT
        value: $PORT 
